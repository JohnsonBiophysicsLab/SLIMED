name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A superseded push has nothing left to prove; stop paying for its runner.
concurrency:
  group: cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # -fopenmp and -DOMP are coupled in CMakeLists.txt, so the two
          # variants compile genuinely different code and both need testing.
          - name: serial
            openmp: 'OFF'
          - name: openmp
            openmp: 'ON'

    name: build (${{ matrix.name }})

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      uses: ./.github/actions/apt-install
      with:
        packages: cmake libgtest-dev libgsl-dev

    # Ubuntu ships GoogleTest as sources; build and install them so that
    # tests/CMakeLists.txt's find_package(GTest) resolves.
    - name: Build and install GoogleTest
      run: |
        sudo cmake -S /usr/src/googletest -B /usr/src/googletest/build
        sudo cmake --build /usr/src/googletest/build --target install

    # Out-of-tree build, matching the invocation CMakeLists.txt documents.
    - name: Configure
      run: cmake -S . -B build -DSLIMED_ENABLE_OPENMP=${{ matrix.openmp }}

    - name: Build
      run: cmake --build build -j"$(nproc)"

    # tests/CMakeLists.txt only warns and returns when GoogleTest is missing,
    # which would otherwise turn a build with no tests at all into a green run.
    - name: Run unit tests
      run: |
        ctest --test-dir build -N
        ctest --test-dir build -N | grep -qE 'Total Tests: [1-9]' || {
          echo "::error::No tests discovered -- GoogleTest was not found at configure time."
          exit 1
        }
        ctest --test-dir build --output-on-failure -j"$(nproc)"

    - name: Show last test log on failure
      if: failure()
      run: cat build/Testing/Temporary/LastTest.log || true
